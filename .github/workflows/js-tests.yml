name: WISP Universal TTS and JS regression tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check src/pkjs/index.js
          node --check tests/pkjs_protocol_test.js
          node --check src/pkjs/universal_tts.js
          node --check src/pkjs/google_tts_legacy.js
          node --check tests/google_tts_legacy.test.cjs
          node --check tests/universal_tts_integration.test.cjs
          node --check tests/plugin_settings_ui.test.cjs
          node --check src/pkjs/agent_plugins.js
          node --check tests/agent_plugins.test.cjs
      - name: Test audio protocol and release hardening
        run: |
          node tests/pkjs_protocol_test.js
          node tests/universal_tts_integration.test.cjs
          node tests/google_tts_legacy.test.cjs
          node tests/plugin_settings_ui.test.cjs
          node tests/agent_plugins.test.cjs

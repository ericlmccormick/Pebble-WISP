name: WISP restored 2.1.6 audio regression tests

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of restored watch-ACK transport
        run: |
          node --check src/pkjs/index.js
          node --check src/pkjs/google_tts_stream.js
          node --check src/pkjs/agent_plugins.js
          node --check tests/pkjs_protocol_test.js
          node --check tests/google_tts_adapter.test.cjs
          node --check tests/plugin_settings_ui.test.cjs
      - name: Run last-working audio and WISP UI regression tests
        run: |
          node tests/pkjs_protocol_test.js
          node tests/google_tts_adapter.test.cjs
          node tests/plugin_settings_ui.test.cjs
          node tests/agent_plugins.test.cjs
